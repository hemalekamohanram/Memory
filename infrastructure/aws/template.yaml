AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Engram consolidation worker and encrypted evidence archive
Parameters:
  DatabaseUrlParameter:
    Type: String
    NoEcho: true
Resources:
  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  ConsolidationWorker:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: services.worker.handler.lambda_handler
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          ENGRAM_MODE: live
          DATABASE_URL: !Ref DatabaseUrlParameter
          S3_ARCHIVE_BUCKET: !Ref EvidenceBucket
      Policies:
        - S3WritePolicy: { BucketName: !Ref EvidenceBucket }
