services:
  cockroach:
    image: cockroachdb/cockroach:v25.2.2
    command: start-single-node --insecure
    ports: ["26257:26257", "8080:8080"]
    volumes: ["cockroach-data:/cockroach/cockroach-data"]
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--execute", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  cockroach-data:
